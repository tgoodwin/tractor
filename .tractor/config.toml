# Tractor per-project configuration.
#
# Precedence for each value (highest first):
#   1. TRACTOR_ACP_<PROVIDER>_{COMMAND,ARGS,ENV_JSON} env var
#   2. This file
#   3. Adapter default (see lib/tractor/agent/*.ex)
#
# The file is optional. Delete it and defaults + env vars still work.

[agents.claude]
command = "claude-code-acp"
args = []

[agents.codex]
# Let Codex implementation nodes edit the audit worktree and associated Git
# metadata without provider permission prompts. The adapter supplies
# -a never --sandbox workspace-write by default.
include_dirs = ["/Users/tgoodwin/projects/tractor"]

[agents.codex.env]
LC_ALL = "C"
LANG = "C"

[agents.gemini]
args = ["--experimental-acp"]
include_dirs = ["/Users/tgoodwin/projects/tractor/.worktrees/audit-fixes-2026-04-28"]
mode = "yolo"

[agents.gemini.env]
LC_ALL = "C"
LANG = "C"
